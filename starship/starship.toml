# Clean, fast Starship config
format = """$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$line_break\
$character"""

# Cursor settings
command_timeout = 500
scan_timeout = 10

# Directory
[directory]
truncation_length = 2
truncate_to_repo = false
format = "[$path]($style) "
style = "bold cyan"

[package]
disabled = true

# Only show what we want
[git_branch]
format = "[$symbol$branch]($style) "
style = "bold magenta"
symbol = "🌿 "

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"

[python]
format = "[${symbol}${pyenv_prefix}(${version})]($style) "
symbol = "🐍 "
style = "bold yellow"

[nodejs]
format = "[${symbol}(${version})]($style) "
symbol = "⬢ "
style = "bold green"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold green)"
vimcmd_visual_symbol = "[❮](bold green)"
